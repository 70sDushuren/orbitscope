[workspace]
resolver = "3"
members = ["crates/orbit-core", "crates/orbit-server", "crates/orbit-sources", "crates/orbitscope"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = ""

[workspace.dependencies]
orbit-core = { path = "crates/orbit-core" }
orbit-sources = { path = "crates/orbit-sources" }
orbit-server = { path = "crates/orbit-server" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sgp4 = "2.4"
thiserror = "2.0"
criterion = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "gzip", "rustls", "form", "query", "system-proxy", "charset"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal", "net"] }
tracing = "0.1"
csv = "1.4"
dirs = "7.0"
wiremock = "0.6"
tempfile = "3"
axum = { version = "0.8.9", features = ["ws"] }
arc-swap = "1.9"
tokio-tungstenite = "0.30"
futures-util = "0.3"
rust-embed = { version = "8.14", features = ["mime-guess"] }
tower-http = { version = "0.7", features = ["fs"] }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
comfy-table = "8.0"
toml = "1.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
