# OrbitScope 示例配置
#
# 复制为 ./orbitscope.toml 或 ~/.config/orbitscope/config.toml 后按需修改;
# 所有字段都可省略(使用默认值)。本文件中的取值即为默认值。
#
# 注意:Space-Track 账号密码【不要】写在这里,请使用环境变量:
#   ORBITSCOPE_SPACETRACK_USER / ORBITSCOPE_SPACETRACK_PASSWORD

[filter]
# 高度范围(km)
alt_min_km = 100.0
alt_max_km = 1000.0
# 高度判据:
#   orbit-overlap  轨道 [近地点, 远地点] 与范围有交集(默认)
#   orbit-within   轨道完全位于范围内
#   instantaneous  当前瞬时高度位于范围内
altitude_mode = "orbit-overlap"
# 最小等效直径(cm),由 RCS 估算;0 表示不过滤
min_size_cm = 10.0
# 尺寸无法判定(未知或 RCS 分档跨越门限)时:include / exclude
unknown_size = "include"
# 物体类型,空表示全部。可选:"PAYLOAD"、"ROCKET BODY"、"DEBRIS"、"UNKNOWN"
object_types = []
# 国家/所有者代码,空表示全部,例如 ["US", "PRC", "CIS"]
countries = []
# inclination_min_deg = 0.0
# inclination_max_deg = 180.0
# query = "STARLINK"
# 根数龄期上限(天),超过视为过期;删除此行表示不限
max_epoch_age_days = 14.0

[sources]
# 缓存目录,默认为用户缓存目录下的 orbitscope
# cache_dir = "/var/cache/orbitscope"

[sources.celestrak]
enabled = true
base_url = "https://celestrak.org"
groups = ["active", "cosmos-1408-debris", "fengyun-1c-debris", "iridium-33-debris", "cosmos-2251-debris"]
# GP 刷新间隔(分钟),硬下限 60
refresh_minutes = 120
# 下载 SATCAT 以补全类型、国家、数值 RCS
satcat = true
satcat_path = "/pub/satcat.csv"
# 硬下限 720
satcat_refresh_minutes = 1440

[sources.spacetrack]
# 需要免费账号;启用后可获得含全部碎片的完整编目
enabled = false
base_url = "https://www.space-track.org"
# 官方规定 GP 每小时最多 1 次,硬下限 60
refresh_minutes = 60
# 服务端预筛:只下载近地点低于该高度(km)的物体;删除此行表示全量
max_periapsis_km = 2000.0
max_epoch_age_days = 10
# 官方上限 30 次/分、300 次/时
requests_per_minute = 20
requests_per_hour = 200

[sources.files]
# 本地 TLE / 3LE / OMM JSON 文件
paths = []

[archive]
# 历史归档:每次获取后不覆盖历史,按"编号 + 历元"保存每组根数并记录首次获取时间。
# 目录默认为用户数据目录下的 orbitscope(macOS: ~/Library/Application Support/orbitscope,
# Linux: ~/.local/share/orbitscope)
# dir = "/var/lib/orbitscope"
# 指定时刻 T 时的默认时刻策略(命令行 --policy、Web 界面可切换):
#   known-at       T 时刻已获取到的最新根数(结果可复现)
#   nearest-epoch  历元最接近 T 的根数(可能用到 T 之后才获取的数据)
#   latest         历元最新的根数
time_policy = "known-at"

[archive.snapshots]
# 每次网络下载的原始文件另存一份带时间戳的压缩快照,超出上限时删除最旧的
enabled = true
max_files = 200       # 0 = 不限
max_total_mb = 1024   # 0 = 不限

[archive.history]
# 根数历史库(SQLite)。清理时删除最旧的根数,但每个物体最新的一条永不删除
enabled = true
retain_days = 0       # 保留最近多少天获取的根数,0 = 不限
max_total_mb = 4096   # 空间上限,0 = 不限

[collect]
# 采集策略(Web 界面也可切换):
#   serve     由 orbitscope serve 负责定期采集(默认)
#   daemon    由常驻进程 orbitscope collect 采集,Web 服务只读本地数据
#   external  由系统定时任务运行 orbitscope fetch 采集,Web 服务只读本地数据
mode = "serve"
# 非 serve 模式下 Web 服务重新加载本地数据的间隔(分钟)
reload_minutes = 5

[server]
# 监听地址。默认只允许本机访问;改为 0.0.0.0:8080 对外开放时,建议设置环境变量
# ORBITSCOPE_API_TOKEN,写操作(修改设置、默认过滤、手动刷新)需携带 Authorization: Bearer <token>。
# 放在反向代理之后时必须设置:未设置 token 时,经代理转发的写请求一律拒绝
bind = "127.0.0.1:8080"
# 位置推送周期(毫秒),最小 100
tick_ms = 1000
# WebSocket 最大连接数
max_ws_clients = 64
# 浏览器从这里加载 CesiumJS(3D 地球引擎),需要浏览器能访问互联网
cesium_url = "https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/"
# 完全离线:下载 CesiumJS 后指向其 Build/Cesium 目录(含 Cesium.js),例如
#   npm pack cesium@1.146.0 && tar -xzf cesium-1.146.0.tgz
#   cesium_dir = "/opt/cesium/package/Build/Cesium"
# cesium_dir = ""
